# Global settings
global:
  environment: "local"
  dns:
    webUI: "firecrest-ui.example.com"

# Deployment settings
replicas: 2
image: "ghcr.io/eth-cscs/firecrest-ui"
loggingLevel: "info"
platform: ""

# Logo settings
companyName: "MyCompany"
appName: "Firecrest Dashboard"
customLogo: false
customLogoVolume: "/usr/server/app/public/custom/logo.svg"
customLogoPath: "./custom/logo.svg"

# OIDC settings
oidcIssuerUrl: "https://auth.example.com/auth/realms/kcrealm"
oidcCallbackUrl: "https://firecrest-ui.example.com/auth/callback"
oidcPostLogoutRedirectUrl: "https://firecrest-ui.example.com/logout"

# Firecrest API settings
firecrestApiBaseUrl: "https://firecrest-api.example.com"

# Redis settings
redisActive: "true"
redisHost: "redis-master"

# Support and documentation URLs
supportUrl: "https://support.example.com"
docUrl: "https://docs.example.com"
repoUrl: "https://github.com/eth-cscs/firecrest-ui"
# Status page link shown on the maintenance screen - omitted entirely if left blank
statusUrl: ""
uiObservabilityDashboard: ""

# Job log viewer: "View" mode (page through large stdout/stderr files) needs FirecREST >= 2.7.0.
# Leave disabled on platforms with an older backend; only "Tail" is offered then.
jobLogViewModeEnabled: "false"
# Mode the job log opens in when View mode is enabled: "tail" or "view"
jobLogDefaultMode: "tail"

# Elastic/Observability settings
elastic:
  dataStream: {}